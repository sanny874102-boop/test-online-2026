<!DOCTYPE html>
<html lang="zh-TW">

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    .q-control { display: flex; align-items: center; gap: 10px; background: #1e293b; padding: 6px 14px; border-radius: 8px; margin-top: 6px; }
    .container { display: grid; grid-template-columns: 1.6fr 1.4fr; gap: 24px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    
    .question-box { font-size: 1.9rem; line-height: 1.8; font-weight: bold; background: #0b1120; padding: 24px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 16px; }
    .options-grid { display: grid; gap: 12px; margin-top: 14px; }
    .opt-card { background: #1e293b; border: 1px solid #475569; padding: 14px 18px; border-radius: 8px; font-size: 1.3rem; }
    .opt-card.correct { background: #14532d; border-color: #22c55e; color: #86efac; font-weight: bold; }
    
    /* 詳解看板 */
    .explain-card { margin-top: 16px; padding: 18px; background: #1e1b4b; border: 2px solid #6366f1; border-radius: 8px; display: none; }
    .explain-card h3 { margin: 0 0 8px 0; color: #a5b4fc; font-size: 1.3rem; }
    .explain-card p { margin: 0; font-size: 1.2rem; line-height: 1.7; color: #e0e7ff; }

    .btn { padding: 9px 16px; font-size: 0.95rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-purple { background: #8b5cf6; color: white; }
    .btn-orange { background: #f97316; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-gray { background: #475569; color: white; }
    .btn:hover { opacity: 0.9; }
    
    /* 管理員控制鎖定樣式 */
    .admin-locked { display: none !important; }
    .badge-status { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px; }
    .badge-locked { background: #64748b; color: #f8fafc; }
    .badge-unlocked { background: #10b981; color: #ffffff; }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 1rem; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
    #qrcode { display: flex; justify-content: center; margin: 14px auto; background: white; padding: 14px; border-radius: 12px; width: fit-content; }
    .players-box { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; max-height: 100px; overflow-y: auto; padding: 10px; background: #0b1120; border-radius: 8px; border: 1px solid #334155; }
    .player-tag { background: #334155; color: #38bdf8; padding: 4px 10px; border-radius: 16px; font-size: 0.95rem; font-weight: bold; }
    
    .tab-bar { display: flex; gap: 8px; margin-top: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .tab-btn { background: none; border: none; color: #94a3b8; font-size: 1.05rem; font-weight: bold; cursor: pointer; padding: 6px 14px; border-radius: 6px; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }
